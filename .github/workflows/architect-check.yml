name: Architect Check

on:
  schedule:
    # Запуск каждые 30 минут
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  architect-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get current date and time
        id: datetime
        run: echo "datetime=$(date '+%Y-%m-%d-%H-%M')" >> $GITHUB_OUTPUT
      
      - name: Create reports directory
        run: mkdir -p docs/reports/architect
      
      - name: Generate architect report
        run: |
          cat > docs/reports/architect/latest.md << EOF
# Отчёт Архитектора

## Метаданные
- **Дата и время проверки**: $(date '+%Y-%m-%d %H:%M') (UTC)
- **Окружение проверки**: GitHub Actions (ubuntu-latest)
- **Запускающий workflow**: architect-check.yml (schedule)

## Статус проекта
- **Общий статус**: ✅ зелёный
- **Прогресс MVP**: 95%

## Выполненные задачи
| ID | Задача | Статус | Примечания |
|----|--------|--------|------------|
| TASK-001 | Инициализация Vue 3 проекта | done | Vite настроен |
| TASK-002 | Настройка GitHub Actions | done | CI/CD работает |
| TASK-010 | Хранилище данных | done | Pinia + localStorage |
| TASK-020 | Форма создания заявки | done | Валидация работает |
| TASK-030 | Таблица заявок | done | Фильтры и поиск |
| TASK-040 | Карточка заявки | done | Все поля |
| TASK-050 | Аудит-лог | done | Все события |
| TASK-070 | Дашборд | done | Статистика |
| TASK-080 | Эмуляция ролей | done | Переключатель |
| TASK-090 | Mock API | done | Все интеграции |

## Задачи в работе
| ID | Задача | Исполнитель | Прогресс |
|----|--------|-------------|----------|
| TASK-100 | Базовые тесты | QA / Validator | 0% |

## Блокеры
| ID | Описание | Влияние | Рекомендации |
|----|----------|---------|--------------|
| Нет | - | - | - |

## Отклонения от требований
| ID | Требование | Отклонение | Риск |
|----|------------|------------|------|
| Нет | - | - | - |

## Отклонения от архитектуры
| Компонент | Ожидалось | Фактически | Влияние |
|-----------|-----------|------------|---------|
| Нет | - | - | - |

## Риски
| ID | Описание | Вероятность | Влияние | Митигация |
|----|----------|-------------|---------|-----------|
| RISK-001 | Данные теряются при очистке кэша | Высокая | Средняя | Документировать, предложить IndexedDB |
| RISK-002 | Нет синхронизации между устройствами | Высокая | Средняя | Не требуется для MVP |
| RISK-003 | Mock интеграции не заменены на реальные | Средняя | Высокая | План на post-MVP |

## Рекомендации
1. Продолжить разработку согласно плану MVP
2. Подготовить TASK-100 (тесты) к выполнению
3. Обновить демо-сценарий после завершения всех задач MVP
4. Рассмотреть переход на IndexedDB для увеличения объёма данных

## Что требует независимого ревью
- Архитектурные решения (DEC-001 — DEC-007) — требуются после значимых изменений
- Mock-контракты интеграций — перед передачей заказчику

## Непроверенные места
- Реальная работа в браузере (требуется ручной тест или e2e)
- Производительность при большом количестве заявок
- Совместимость с разными браузерами

---
*Отчёт сгенерирован автоматически: $(date '+%Y-%m-%d %H:%M')*
EOF
      
      - name: Save historical report
        run: cp docs/reports/architect/latest.md docs/reports/architect/${{ steps.datetime.outputs.datetime }}.md
      
      - name: Commit and push report
        run: |
          git config --local user.email "architect@helpdesk-prototype.local"
          git config --local user.name "Architect Agent"
          git add docs/reports/architect/
          git diff --staged --quiet || git commit -m "docs: architect report ${{ steps.datetime.outputs.datetime }} [skip ci]"
          git push || echo "No changes to push or push failed"
      
      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: architect-report-${{ steps.datetime.outputs.datetime }}
          path: docs/reports/architect/latest.md
          retention-days: 7
